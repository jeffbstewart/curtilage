// Server configuration (docs/DESIGN.md).  The household's file is
// protobuf TEXT FORMAT (curtilage.textproto): human-editable, commented,
// and typed against this schema -- a typo is a parse error, not a
// silently ignored key.  Credentials are never in the file; they come
// from the environment (CURTILAGE_MQTT_USER / CURTILAGE_MQTT_PASSWORD).
syntax = "proto3";

package curtilage.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/jeffbstewart/curtilage/gen/curtilage/v1;curtilagev1";

message Config {
  Mqtt mqtt = 1;
  Recording recording = 2;
  // Address for the API, /metrics, /healthz and /admin, e.g. ":9118".
  // One listener: gRPC (h2c) and HTTP share it, as MediaManager does.
  string listen = 3;
  // What the app calls this installation (GetServerInfo);
  // "curtilage" if unset.
  string display_name = 4;
  // Frigate's HTTP API, for media.  Media is off when unset.
  Frigate frigate = 5;
  Links links = 6;
  House house = 7;
  // IANA time zone for anything a person reads (the house page):
  // "America/New_York".  UTC if unset.  The zone database is built
  // into the binary, so this needs nothing from the container.
  string timezone = 8;
}

// The in-the-house page, GET /house/: the last day of events with the
// policy engine's verdict and audience for each -- what was sent, or
// would have been, to whom.  The tuning tool.  Off unless allow_cidrs
// is set; a caller from anywhere else gets a 404 like any other
// unsigned request.
message House {
  // Callers allowed, in CIDR form: "192.168.1.0/24", "198.51.100.0/24".
  repeated string allow_cidrs = 1;
  // Reverse proxies whose X-Forwarded-For is believed, in CIDR form.
  // The caller is then the rightmost forwarded address that is not
  // itself a trusted proxy.  Empty: the header is ignored entirely.
  repeated string trusted_proxies = 2;
}

message Frigate {
  // e.g. "http://frigate.cameras.svc.cluster.local:5000".  Curtilage
  // is the only thing that talks to it; nothing is passed through.
  string url = 1;
}

// Media links are capability tokens (docs/DESIGN.md "Identity").
// The signing keys are NOT here: CURTILAGE_MEDIA_KEY (current, mints
// and verifies) and CURTILAGE_MEDIA_KEY_PRIOR (optional; verifies
// only, during a rotation) in the environment, each `openssl rand
// -base64 32`.  Every instance behind a load balancer gets the same
// two.  To rotate: prior <- current, current <- new, roll; drop prior
// once ttl has passed.
message Links {
  // How long a minted link stays valid; 4h if unset.
  google.protobuf.Duration ttl = 1;
}

message Mqtt {
  // Broker host, e.g. "mosquitto.cameras.svc.cluster.local".
  string host = 1;
  // Broker port; 1883 if unset.
  uint32 port = 2;
  // MQTT client id; "curtilage" if unset.  Must be unique per broker.
  string client_id = 3;
  // Topic filters to subscribe to, e.g. "frigate/#".
  repeated string subscriptions = 4;
  // Topic prefix curtilage publishes under (availability, later
  // conclusions); "curtilage" if unset.
  string publish_prefix = 5;
  // Keepalive; 30s if unset.
  google.protobuf.Duration keepalive = 6;
}

message Recording {
  // Directory for MCAP files; recording is off when empty.
  string dir = 1;
  // Start a new file this often; 24h if unset.  Files are named by
  // their start time (UTC): curtilage-YYYYMMDDTHHMMSSZ.mcap.
  google.protobuf.Duration rotate_every = 2;
  // How long events are kept, in memory and as files on disk; older
  // ones are pruned hourly.  7 days if unset.  The event store is
  // rebuilt from these files at startup, so this is also how far back
  // ListEvents can go.
  google.protobuf.Duration retention = 3;
}
